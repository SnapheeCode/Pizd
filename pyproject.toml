[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avtor24-bot"
version = "0.1.0"
description = "MVP autobidder for avtor24 orders"
authors = [{name = "Automation"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.44",
]

[project.scripts]
avtor24-bot = "avtor24_bot.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
